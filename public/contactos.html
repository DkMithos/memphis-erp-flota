  <style>
    :root {
      --gold: #F8C119;
      --gold-dark: #BA9113;
      --gold-light: #FAD54D;
      --gray: #666666;
      --dark: #111827;
      --wa: #25D366;
      --wa-dark: #1ebe5b;
      --card: #1b2435;
      --card-border: #2b3850;
      --text: #f4f6fb;
      --text-dim: #aeb7c7;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1100px 520px at 50% -10%, rgba(248, 193, 25, 0.16), transparent 60%),
        linear-gradient(180deg, #0d1422 0%, var(--dark) 55%, #0b1120 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 16px 48px;
    }

    .shell {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: 230px;
      max-width: 72%;
      height: auto;
      margin-bottom: 26px;
      filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.45));
    }
    /* El wordmark gris del SVG se ve mejor en claro sobre fondo oscuro */
    .logo .wordmark { fill: #e9edf5; }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      margin: 0 0 6px;
    }

    h1 {
      font-size: 28px;
      line-height: 1.15;
      margin: 0 0 8px;
      text-align: center;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .subtitle {
      margin: 0 0 30px;
      color: var(--text-dim);
      font-size: 15px;
      text-align: center;
      max-width: 340px;
    }

    .contacts {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .contact {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px 18px;
      border-radius: 16px;
      background: linear-gradient(180deg, var(--card) 0%, #161f2e 100%);
      border: 1px solid var(--card-border);
      color: var(--text);
      text-decoration: none;
      transition: transform 0.14s ease, border-color 0.14s ease, box-shadow 0.14s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .contact:hover,
    .contact:focus-visible {
      transform: translateY(-2px);
      border-color: var(--wa);
      box-shadow: 0 10px 26px rgba(0, 0, 0, 0.4);
      outline: none;
    }
    .contact:active { transform: translateY(0); }

    .contact .wa-badge {
      flex: 0 0 auto;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--wa);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .contact .wa-badge svg { width: 26px; height: 26px; fill: #fff; }

    .contact .info { flex: 1 1 auto; min-width: 0; }

    .contact .role {
      display: block;
      font-size: 12px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 3px;
    }

    .contact .number {
      display: block;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.4px;
      white-space: nowrap;
    }

    .contact .chev {
      flex: 0 0 auto;
      color: var(--text-dim);
    }

    .hint {
      margin-top: 26px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-dim);
    }
    .hint svg { width: 16px; height: 16px; fill: var(--wa); }

    footer {
      margin-top: 34px;
      font-size: 12px;
      color: #7b869a;
      text-align: center;
      line-height: 1.5;
    }

    @media (max-width: 360px) {
      h1 { font-size: 24px; }
      .contact .number { font-size: 18px; }
    }
  </style>
</head>
